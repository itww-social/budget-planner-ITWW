<style>
/* Layout: workbook-style planner. Settings and project summary on top, then one ledger grid per engineer (months across, cost elements down, budget and actual side by side). */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --surface2: #f6f8f7;
  --ink: #1a2327;
  --muted: #586a70;
  --line: #d6dddb;
  --accent: #0e6a78;
  --accent-ink: #ffffff;
  --accent-soft: #e0f0f2;
  --actual: #edf4f6;
  --ov: #fcefcc;
  --ov-mark: #c47f0a;
  --good: #1b7a49;
  --bad: #b3372b;
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101719; --surface: #172023; --surface2: #1c272b; --ink: #e3eaeb; --muted: #93a5aa;
    --line: #2b393d; --accent: #4fb6c4; --accent-ink: #06191c; --accent-soft: #17353a; --actual: #1a2b31;
    --ov: #3b3014; --ov-mark: #e0a23a; --good: #58c58b; --bad: #f0857a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101719; --surface: #172023; --surface2: #1c272b; --ink: #e3eaeb; --muted: #93a5aa;
  --line: #2b393d; --accent: #4fb6c4; --accent-ink: #06191c; --accent-soft: #17353a; --actual: #1a2b31;
  --ov: #3b3014; --ov-mark: #e0a23a; --good: #58c58b; --bad: #f0857a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 72px;
}
.wrap { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-size: 26px; letter-spacing: .01em; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-width: 150px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok::before { background: var(--good); }
.status.warn::before { background: var(--ov-mark); }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 7px 12px; cursor: pointer; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.icon { border: 0; background: transparent; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; font-size: 14px; }
.icon:hover { background: var(--accent-soft); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel > h2 { font-size: 17px; margin-bottom: 12px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.f input, .f select, .f textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0;
}
.f input.mono, .mono { font-family: var(--f-num); }
.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; }
.check input { width: auto; }
.check span { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.settings-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; }
.partners { display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 8px; align-items: center; }
.prow input { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
.warn-text { color: var(--bad); font-size: 12.5px; min-height: 18px; }
.hint { color: var(--muted); font-size: 12.5px; }

/* summary table */
.tablewrap { overflow-x: auto; }
table.sum { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.sum th, .sum td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.sum th:first-child, .sum td:first-child { text-align: left; }
.sum thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.sum td { font-family: var(--f-num); }
.sum td:first-child { font-family: var(--f-body); }
.sum tr.strong td { font-weight: 600; background: var(--surface2); }
.sum tr.group td { font-family: var(--f-body); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: transparent; padding-top: 12px; }
.sum td.act, .sum th.act { background: var(--actual); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.dim { color: var(--muted); }

/* engineer card */
.eng { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.eh { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.eh-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nin { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; min-width: 0; }
.nin:hover { border-color: var(--line); }
.nin.title { font-family: var(--f-display); font-weight: 600; font-size: 20px; flex: 1 1 200px; }
.eh-actions { display: flex; gap: 6px; }
.ekpi { display: flex; flex-wrap: wrap; gap: 6px 28px; }
.ekpi div { display: flex; flex-direction: column; }
.ekpi small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ekpi b { font-family: var(--f-num); font-weight: 500; font-size: 15px; }
.ebody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }

/* ledger grid */
.gridwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.grid th, .grid td { padding: 0 6px; height: 34px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.grid thead th {
  background: var(--surface2); font-weight: 500; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; text-align: right; height: 30px;
}
.grid thead th.l { text-align: left; }
.grid thead th.mh { text-align: center; color: var(--ink); border-left: 1px solid var(--line); line-height: 1.2; padding-block: 4px; height: auto; }
.grid thead th.mh small { display: block; font-size: 10.5px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.grid .stick { position: sticky; left: 0; z-index: 2; min-width: 220px; max-width: 220px; box-shadow: 1px 0 0 var(--line); text-align: left; }
.grid thead .stick { z-index: 3; background: var(--surface2); }
.grid td.num { text-align: right; font-family: var(--f-num); padding-inline: 10px; }
.grid td.inc { position: relative; padding: 0 2px; }
.grid td.act, .grid th.act { background: var(--actual); }
.grid thead th.act { background: var(--actual); }
.grid td.mstart { border-left: 1px solid var(--line); }
.grid tr.sec td { height: 26px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface2); font-weight: 500; }
.grid tr.sec td.stick { background: var(--surface2); }
.grid tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }
.grid tr.marg td { font-weight: 600; background: var(--accent-soft); }
.grid tr.marg td.stick { background: var(--accent-soft); }
.grid tr.part td { color: var(--muted); font-size: 12.5px; }
.grid td.tot { border-left: 1px solid var(--line); }
.cin {
  width: 82px; text-align: right; font-family: var(--f-num); font-size: 13px; background: transparent;
  border: 1px solid transparent; border-radius: 4px; padding: 5px 6px;
}
.cin:hover { border-color: var(--line); }
.cin:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.cin.bad, .nin.bad, .f input.bad { border-color: var(--bad); }
td.ovc { background: var(--ov); }
td.ovc::after { content: ""; position: absolute; top: 0; right: 0; border-top: 7px solid var(--ov-mark); border-left: 7px solid transparent; }
.grid .nin { width: 100%; font-size: 13px; padding: 5px 6px; }
.grid select { border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 5px 2px; font-size: 12.5px; max-width: 140px; }
.grid select:hover { border-color: var(--line); }
.grid .amt { width: 118px; }
.toast[hidden] { display: none; }
.dash { color: var(--muted); padding-inline: 8px; }
.delrow { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 16px; width: 28px; height: 28px; border-radius: 4px; }
.delrow:hover { color: var(--bad); background: var(--surface2); }
.addbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.addbar .hint { margin-left: auto; }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); }
.addeng { display: flex; justify-content: flex-start; }

.toast {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; display: flex; gap: 14px; align-items: center; z-index: 20;
  max-width: calc(100% - 32px);
}
.toast button { background: transparent; border: 0; color: var(--bg); text-decoration: underline; cursor: pointer; font-weight: 600; }

@media (max-width: 760px) {
  .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .top h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {

  var fP = function (v) { return nfp.format(Math.round(v) + 0); };

  var fC2 = function (v) { return cur2.format(Math.round(v * 100) / 100 + 0); };
  var fPct = function (v) { return (Math.round(v * 1000) / 10 + 0).toFixed(1).replace('.', ',') + '%'; };
  var signed = function (v, f, tol) {

  };

  /* ---------- safe arithmetic (amounts can be typed as 278+250+250) ---------- */
  function evalExpr(src) {
    var s = String(src).replace(/,/g, '.').replace(/\s+/g, ''), i = 0;
    function fail() { throw 0; }
    function expr() { var v = term(); while (s[i] === '+' || s[i] === '-') { var op = s[i++]; var r = term(); v = op === '+' ? v + r : v - r; } return v; }
    function term() { var v = factor(); while (s[i] === '*' || s[i] === '/') { var op = s[i++]; var r = factor(); v = op === '*' ? v * r : v / r; } return v; }
    function factor() {
      if (s[i] === '-') { i++; return -factor(); }
      if (s[i] === '+') { i++; return factor(); }
      if (s[i] === '(') { i++; var v = expr(); if (s[i] !== ')') fail(); i++; return v; }
      var m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if (!m) fail();
      i += m[0].length; return parseFloat(m[0]);

    try { var v = expr(); return (i === s.length && isFinite(v)) ? v : NaN; } catch (e) { return NaN; }
  }
  function num(v) { if (v === '' || v == null) return null; if (typeof v === 'number') return v; return evalExpr(v); }
  function ok(x) { return x != null && !isNaN(x); }
  function val(v, d) { var x = num(v); return ok(x) ? x : (d || 0); }

  /* ---------- dates ---------- */
  var DAY = 864e5;
  function pd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
  function iso(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  var monthFmt = new Intl.DateTimeFormat('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' });

  /* ---------- state ---------- */
  function mkCost(name, type, amount, month) { return { id: uid(), name: name, type: type, amount: String(amount), month: month || 1, ov: {}, act: {} }; }
  function sample() {
    return {
      v: 1, ui: { showActuals: true },
      project: {
        name: 'Engineering project', rate: '52', hours: '200', prorate: true, horizon: 3,
        notes: '200 hours per month. Overtime not included.',

      },
      engineers: [{
        id: uid(), name: 'Engineer 1', start: '2026-12-01', end: '2027-05-31', hours: '', rate: '', collapsed: false, ovHours: {}, actHours: {},
        costs: [
          mkCost('agent fees recruitment', 'once', 350),
          mkCost('visa aanvraag', 'once', 500),
          mkCost('twv aanvraag', 'once', 500),
          mkCost('vliegticket', 'once', 1200),
          mkCost('certificeringen (VCA / IPAF / NEN)', 'once', '278+250+250'),
          mkCost('PBM', 'once', 750),
          mkCost('visa aanvraag (maand 4)', 'once', 500, 4),
          mkCost('twv aanvraag (maand 4)', 'once', 500, 4),
          mkCost('vliegticket (maand 4)', 'once', 1200, 4),
          mkCost('verzekeringen', 'monthly', 400),
          mkCost('transport woon werkverkeer', 'monthly', 500),
          mkCost('eetvergoeding', 'monthly', 600),
          mkCost('huisvesting', 'monthly', 1000),
          mkCost('salaris', 'monthly', 1800),
          mkCost('onvoorzien', 'monthly', 200)
        ]
      }]
    };
  }
  function norm(s) {
    var d = sample();
    if (!s || typeof s !== 'object' || !Array.isArray(s.engineers)) return d;
    s.ui = s.ui || { showActuals: true };
    s.project = Object.assign({}, d.project, s.project || {});
    if (!Array.isArray(s.project.partners)) s.project.partners = d.project.partners;
    s.project.partners.forEach(function (p) { p.id = p.id || uid(); });
    s.engineers.forEach(function (e) {
      e.id = e.id || uid(); e.costs = Array.isArray(e.costs) ? e.costs : [];
      e.ovHours = e.ovHours || {}; e.actHours = e.actHours || {};
      e.costs.forEach(function (c) { c.id = c.id || uid(); c.ov = c.ov || {}; c.act = c.act || {}; c.type = c.type || 'monthly'; c.month = c.month || 1; });

  }

  var dirty = false, dbh = null, lastSnap = null, focusRow = null;

  var P = function () { return state.project; };
  var engOf = function (id) { return state.engineers.filter(function (e) { return e.id === id; })[0]; };

  /* ---------- calculations ---------- */

    var R = {}, parts = p.partners;

    var hovRaw = months.map(function (m) { return e.ovHours[m.ym]; });
    var hb = months.map(function (m, i) { var o = num(hovRaw[i]); return ok(o) ? o : hpm * m.frac; });

        var o = num(raw[i]); if (ok(o)) return o;

    var revB = hb.map(function (h) { return h * rate; });

    }
    if (d.pf && t.type !== 'checkbox') { P()[d.pf] = t.value; if (d.pf === 'rate' || d.pf === 'hours') flagBad(t); touch(); paint(); return; }
    if (d.pt) { var pt = P().partners[+d.k]; pt[d.pt] = d.pt === 'pct' ? t.value : t.value; if (d.pt === 'pct') { pt.pct = t.value; } touch(); paint(); }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target, d = t.dataset;
    if (d.f === 'start' || d.f === 'end') { engOf(d.eid)[d.f] = t.value; touch(); render(); return; }
    if (d.rf === 'type' || d.rf === 'month') { costOf(engOf(d.eid), d.rid)[d.rf] = d.rf === 'month' ? parseInt(t.value, 10) : t.value; touch(); render(); return; }
    if (d.pf === 'prorate') { P().prorate = t.checked; touch(); render(); }
  });
  app.addEventListener('focusout', function (ev) { if (ev.target.dataset && (ev.target.dataset.in || ev.target.dataset.rf === 'amount')) setTimeout(paint, 0); });

  function newEngineer() {
    var now = new Date(), y = now.getUTCFullYear(), m = now.getUTCMonth() + 1;
    var s = Date.UTC(y, m, 1), e = Date.UTC(y, m + 6, 0), last = state.engineers[state.engineers.length - 1];
    return {
      id: uid(), name: 'Engineer ' + (state.engineers.length + 1), start: iso(s), end: iso(e), hours: '', rate: '', collapsed: false, ovHours: {}, actHours: {},
      costs: last ? last.costs.map(function (c) { return { id: uid(), name: c.name, type: c.type, amount: c.amount, month: c.month, ov: {}, act: {} }; }) : []
    };
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, e = b.dataset.eid ? engOf(b.dataset.eid) : null;
    if (a === 'toggle-actuals') { state.ui.showActuals = !state.ui.showActuals; touch(); render(); }
    else if (a === 'toggle-eng') { e.collapsed = !e.collapsed; touch(); render(); }
    else if (a === 'add-eng') { state.engineers.push(newEngineer()); touch(); render(); }
    else if (a === 'dup-eng') {
      var i = state.engineers.indexOf(e), cp = JSON.parse(JSON.stringify(e));
      cp.id = uid(); cp.name = e.name + ' (copy)'; cp.actHours = {}; cp.costs.forEach(function (c) { c.id = uid(); c.act = {}; });
      state.engineers.splice(i + 1, 0, cp); touch(); render();
    }
    else if (a === 'del-eng') withUndo('Removed ' + (e.name || 'engineer') + '.', function () { state.engineers.splice(state.engineers.indexOf(e), 1); });
    else if (a === 'add-row') {
      var nr = mkCost('', b.dataset.type, 0); e.costs.push(nr); focusRow = nr.id; touch(); render();
    }
    else if (a === 'del-row') { var cs = costOf(e, b.dataset.rid); withUndo('Removed ' + (cs.name || 'cost row') + '.', function () { e.costs.splice(e.costs.indexOf(cs), 1); }); }
    else if (a === 'add-partner') { P().partners.push({ id: uid(), name: '', pct: 0 }); touch(); render(); }
    else if (a === 'del-partner') withUndo('Removed partner.', function () { P().partners.splice(+b.dataset.k, 1); });
    else if (a === 'export') exportJSON();
    else if (a === 'import') $('#importfile').click();
    else if (a === 'reset') {
      if (b.dataset.armed) { withUndo('Reset to the example.', function () { state = sample(); }); }
      else { b.dataset.armed = '1'; b.textContent = 'Click again to reset'; setTimeout(function () { var r = $('#resetbtn'); if (r) { delete r.dataset.armed; r.textContent = 'Reset to example'; } }, 4000); }
    }
  });
  $('#importfile').addEventListener('change', function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { var s = JSON.parse(rd.result); if (!s || !Array.isArray(s.engineers)) throw 0; withUndo('Imported ' + f.name + '.', function () { state = norm(s); }); }
      catch (e) { toast('That file is not a budget export.'); }
    };
    rd.readAsText(f); ev.target.value = '';
  });
  async function exportJSON() {
    var json = JSON.stringify(state, null, 2);
    try {
      var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: 'engineer-budget.json', data: json }); toast('Export ready.'); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
    try { await navigator.clipboard.writeText(json); toast('Download is not available here. The export JSON is copied to your clipboard.'); }
    catch (e) { toast('Export is not available in this view.'); }
  }

  render();
  initStore();
})();
</script>

</body></html>
